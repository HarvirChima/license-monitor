# Runs the license monitor on a schedule (every 6 hours by default)
name: GitHub License Monitor

on:
  # schedule:
  #   - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allow manual runs

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run license monitor
        env:
          GITHUB_TOKEN: ${{ secrets.ENTERPRISE_PAT }}
          GITHUB_ENTERPRISE: ${{ secrets.ENTERPRISE_SLUG }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LICENSE_THRESHOLD_PCT: "90"
        run: python github_license_monitor.py
